<!doctype html><meta charset="utf-8"><h1>Immersia profile regression check</h1><pre id="result">Running…</pre><iframe src="/templates/viridarium/index.html" style="width:390px;height:844px"></iframe><script type="module">
import {createGardenPayload} from '/src/components/templates/viridarium/adapter.js';
const frame=document.querySelector('iframe'),out=document.getElementById('result');let phase=0;const canvas=document.createElement('canvas');canvas.width=64;canvas.height=100;const ctx=canvas.getContext('2d');ctx.fillStyle='#72835a';ctx.fillRect(16,8,32,92);const art=canvas.toDataURL('image/png');
const inv={coupleProfile:{brideName:'Test',brideIg:'@test_bride',brideFather:'Ayah Test',brideMother:'Nama Ibu',brideBio:'Bio nyata <b>tetap teks</b>.',groomIg:'@test_groom',groomFather:'Nama Ayah',groomMother:'Ibu Test',groomBio:'Bio pria.'},themeSettings:{brideBioEnabled:true,groomBioEnabled:true,characterSettings:{mode:'custom',separatePose:false,cover:{scale:1,x:0,y:0},hero:{scale:1,x:0,y:0}}},characterRenderAssets:{coverCouple:art,heroCouple:art}};let payload=createGardenPayload(inv,null,true);
const assert=(v,msg)=>{if(!v)throw Error(msg)};
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;if(e.data.type==='garden:ready'){frame.contentWindow.postMessage({type:'garden:configure',payload},location.origin)}if(e.data.type==='garden:failed')out.textContent='FAIL: scene failed';if(e.data.type==='garden:loaded'){try{const doc=frame.contentDocument;if(phase===0){assert(doc.querySelector('#bride-detail .configured').disabled===false,'bride Instagram');assert(doc.querySelector('#groom-detail .configured').disabled===false,'groom Instagram');assert(doc.querySelector('#groom-detail .person-family').textContent.includes('Bapak Nama Ayah'),'father prefix');assert(doc.querySelector('#bride-detail .person-family').textContent.includes('Ibu Nama Ibu'),'mother prefix');assert(doc.querySelector('#bride-detail .person-bio').textContent==='Bio nyata <b>tetap teks</b>.','bio literal text');assert(!doc.querySelector('#bride-detail .person-bio b'),'bio HTML escaped');assert(frame.contentWindow.InvitationConfig.assets.coverCouple===art,'uploaded art reaches renderer');phase=1;inv.themeSettings.brideBioEnabled=false;payload=createGardenPayload(inv,null,true);frame.contentWindow.postMessage({type:'garden:configure',payload},location.origin)}else{assert(doc.querySelector('#bride-detail .person-bio').hidden,'bio hidden on toggle');assert(doc.querySelectorAll('#bride-detail .person-bio').length===1,'no duplicate bio after update');out.textContent='PASS: uploaded art, Instagram fields, parent titles, literal bio, visibility toggle, no duplicate nodes.'}}catch(err){out.textContent='FAIL: '+err.message}}});
</script>
