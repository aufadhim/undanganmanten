<!doctype html><html><head><meta charset="utf-8"><title>Typography regression check</title><style>#fixture h1{font-size:40px;line-height:1.1}#fixture p{font-size:20px;line-height:1.5}</style></head><body><main id="fixture"><h1>Arunika & Deva</h1><p>Informasi acara dan cerita pasangan.</p></main><output id="result">Checking…</output><script type="module">
import {mountTypography} from '/templates/shared/typography-runtime.js';
const root=document.getElementById('fixture'),heading=root.querySelector('h1'),body=root.querySelector('p');const settings={fontHeading:'cursive',fontBody:'serif',metricsMode:'custom',headingScale:.75,bodyScale:1.2,headingLineHeight:1.4,bodyLineHeight:1.8,headingLetterSpacing:.03,bodyLetterSpacing:.02};
const runtime=mountTypography(root,settings);let checks=0;function check(ok,label){if(!ok)throw Error(label);checks++}
try{check(parseFloat(getComputedStyle(heading).fontSize)===30,'Heading scale');check(parseFloat(getComputedStyle(body).fontSize)===24,'Body scale');check(parseFloat(getComputedStyle(heading).lineHeight)===42,'Heading line height');check(parseFloat(getComputedStyle(body).lineHeight)===43.2,'Body line height');runtime.update(settings);check(parseFloat(getComputedStyle(heading).fontSize)===30,'No cumulative scaling');runtime.update({metricsMode:'template'});check(parseFloat(getComputedStyle(heading).fontSize)===40,'Heading reset');check(parseFloat(getComputedStyle(body).fontSize)===20,'Body reset');runtime.destroy();document.getElementById('result').textContent=`PASS: ${checks} typography checks (scale, spacing, repeated update, native reset).`;}catch(e){document.getElementById('result').textContent='FAIL: '+e.message;throw e}
</script></body></html>
