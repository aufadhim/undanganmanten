<!doctype html><html><head><meta charset="utf-8"><title>Journey route integration</title><style>body{font:15px system-ui;background:#f5f2e8;color:#45553a;padding:20px}iframe{width:390px;height:740px;border:0}button{padding:12px;margin:10px}output{display:block;white-space:pre-wrap;margin:16px}</style></head><body><h1>Journey reorder integration</h1><button id="run" disabled>Run reordered journey checks</button><output id="result">Loading template…</output><iframe title="Test invitation"></iframe><script type="module">
import {createGardenPayload} from '/src/components/templates/viridarium/adapter.js';
const theme=new URLSearchParams(location.search).get('theme')||'garden-canvas',frame=document.querySelector('iframe'),result=document.getElementById('result'),run=document.getElementById('run');
const pack=await fetch(`/templates/${theme}/config/invitation.json`).then(r=>r.json());const invitation={themeId:theme,coupleProfile:{brideName:'Test Bride',groomName:'Test Groom'},themeSettings:{layoutOrder:[{id:'gallery',enabled:true},{id:'story',enabled:true},{id:'events',enabled:true},{id:'countdown',enabled:true}]},invitationFeatures:{musicEnabled:false}};let payload=createGardenPayload(invitation,null,true,pack);const send=()=>frame.contentWindow.postMessage({type:'garden:configure',payload},location.origin);
addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin)return;if(e.data?.type==='garden:ready')send();if(e.data?.type==='garden:loaded'){run.disabled=false;result.textContent=`Ready: ${theme}`}});frame.src=`/templates/${theme}/index.html`;
const wait=predicate=>new Promise((resolve,reject)=>{const start=performance.now();function tick(){if(predicate())return resolve();if(performance.now()-start>25000)return reject(Error('Timed out'));setTimeout(tick,80)}tick()});
run.onclick=async()=>{run.disabled=true;let checks=0;const check=(value,label)=>{if(!value)throw Error(label);checks++};try{const win=frame.contentWindow,doc=frame.contentDocument;await wait(()=>win.invitationNavigator);const nav=win.invitationNavigator;check(nav.getRoute().slice(0,5).join(',')==='hero,galeri,cerita,akad,countdown','Custom order');doc.getElementById('open').click();result.textContent='Opening invitation…';await wait(()=>doc.getElementById('cover').classList.contains('gone'));result.textContent='Going directly to gallery…';await nav.goTo('galeri');check(nav.getCurrent()==='galeri','Gallery destination');check(doc.body.dataset.room==='3','Gallery room retained');check(Math.abs(win.heroScene.overridePose.z-payload.config.cameras[8].mobile.z)<1,'Gallery camera retained');await nav.step(1);check(nav.getCurrent()==='cerita','Next uses edited order');result.textContent='Crossing from room 3 to room 2…';await nav.step(1);check(nav.getCurrent()==='akad','Next crosses to ceremony');check(doc.body.dataset.room==='2','Ceremony room retained');await nav.step(-1);check(nav.getCurrent()==='cerita','Previous uses edited order');const dots=[...doc.querySelectorAll('.section-dot:not([hidden])')].map(n=>n.dataset.scene);check(dots.slice(0,6).join(',')==='cover,hero,galeri,cerita,akad,countdown','Dot order');result.textContent='Testing live disable and closing portal…';payload={...payload,layoutOrder:payload.layoutOrder.map(b=>b.id==='story'?{...b,enabled:false}:b)};send();await wait(()=>!nav.getRoute().includes('cerita')&&nav.getCurrent()==='hero'&&!doc.body.hasAttribute('aria-busy'));check(![...doc.querySelectorAll('.section-dot:not([hidden])')].some(n=>n.dataset.scene==='cerita'),'Hidden current scene removed from dots');await nav.goTo('penutup');check(nav.getCurrent()==='penutup','Closing destination');await nav.goTo('hero');check(nav.getCurrent()==='hero','Return from closing');result.textContent=`PASS ${theme}: ${checks} checks — reorder, forward/back, camera and room identity, dots, live disable, closing/return.`;}catch(e){result.textContent=`FAIL ${theme}: ${e.message}`;console.error(e)}finally{run.disabled=false}};
</script></body></html>
